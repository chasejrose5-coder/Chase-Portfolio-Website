[server]
enableStaticServing = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#D6FF4A"
backgroundColor = "#A8483A"
secondaryBackgroundColor = "#F7F1E8"
textColor = "#14120F"
linkColor = "#FFFFFF"
borderColor = "#FFFFFF"
baseRadius = "none"
font = "Literata:https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,650;1,7..72,400&display=swap"
headingFont = "Anton:https://fonts.googleapis.com/css2?family=Anton&display=swap"

[ui]
hideTopBar = true
